[project]
name = "pneumonia-xray-classifier"
version = "1.0.0"
description = "Chest X-ray pneumonia classifier (ML Zoomcamp 2026 midterm project)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
# Runtime dependencies: everything the web service needs (this is all that goes into Docker)
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "onnxruntime>=1.20",
    "numpy>=1.26,<3",
    "pillow>=10.4",
]

[dependency-groups]
# Training / notebook dependencies (not needed in the serving container)
train = [
    "torch>=2.5",
    "torchvision>=0.20",
    "onnx>=1.17",
    "onnxscript>=0.1",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]
dev = [
    "requests>=2.32",
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
default-groups = ["train", "dev"]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
